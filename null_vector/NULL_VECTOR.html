<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NULL VECTOR</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #02040a;
            overflow: hidden;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            touch-action: none;
        }
        #status {
            position: fixed;
            left: 12px;
            bottom: 12px;
            color: #6a8aaa;
            font: 12px/1.4 monospace;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0" width="1920" height="1080"></canvas>
    <div id="status">Loading…</div>
    <script type="text/javascript">
        var LOGICAL_WIDTH = 1920;
        var LOGICAL_HEIGHT = 1080;
        var THRUST_RADIUS = LOGICAL_WIDTH / 12.0;

        function detectMobileWeb() {
            var touchCapable = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            var coarsePointer = window.matchMedia('(pointer: coarse)').matches;
            var noHover = window.matchMedia('(hover: none)').matches;
            var mobileUa = /Android|webOS|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent || '');
            return touchCapable && (coarsePointer || noHover || mobileUa);
        }

        function thrustButtonCenters() {
            return {
                leftCx: THRUST_RADIUS,
                rightCx: LOGICAL_WIDTH - THRUST_RADIUS,
                cy: LOGICAL_HEIGHT - THRUST_RADIUS,
                radius: THRUST_RADIUS
            };
        }

        function isThrustLogicalPoint(lx, ly) {
            var buttons = thrustButtonCenters();
            var radiusSq = buttons.radius * buttons.radius;
            function inCircle(cx, cy) {
                var dx = lx - cx;
                var dy = ly - cy;
                return (dx * dx + dy * dy) <= radiusSq;
            }
            return inCircle(buttons.leftCx, buttons.cy) || inCircle(buttons.rightCx, buttons.cy);
        }

        function canvasCoordsFromTouch(canvas, touch) {
            var rect = canvas.getBoundingClientRect();
            var canvasAspect = canvas.width / canvas.height;
            var rectAspect = rect.width / rect.height;
            var contentW = 0.0;
            var contentH = 0.0;
            var offsetX = 0.0;
            var offsetY = 0.0;

            if (rectAspect > canvasAspect) {
                contentH = rect.height;
                contentW = contentH * canvasAspect;
                offsetX = (rect.width - contentW) * 0.5;
            } else {
                contentW = rect.width;
                contentH = contentW / canvasAspect;
                offsetY = (rect.height - contentH) * 0.5;
            }

            var localX = touch.clientX - rect.left - offsetX;
            var localY = touch.clientY - rect.top - offsetY;
            if (localX < 0.0 || localY < 0.0 || localX > contentW || localY > contentH) {
                return null;
            }

            return {
                x: (localX / contentW) * canvas.width,
                y: (localY / contentH) * canvas.height
            };
        }

        function installTouchTracking(canvas, touchBucket) {
            if (!canvas || !touchBucket) {
                return;
            }

            var touchMap = Object.create(null);

            function rebuildActiveTouches() {
                touchBucket.length = 0;
                for (var id in touchMap) {
                    if (!Object.prototype.hasOwnProperty.call(touchMap, id)) {
                        continue;
                    }
                    var entry = touchMap[id];
                    touchBucket.push({
                        id: entry.id,
                        x: entry.x,
                        y: entry.y,
                        isThrust: entry.isThrust
                    });
                }
            }

            function updateTouchEntries(event) {
                event.preventDefault();
                var i;
                var touch;
                var coords;

                if (event.type === 'touchstart' || event.type === 'touchmove') {
                    for (i = 0; i < event.changedTouches.length; ++i) {
                        touch = event.changedTouches[i];
                        coords = canvasCoordsFromTouch(canvas, touch);
                        if (!coords) {
                            continue;
                        }
                        if (event.type === 'touchstart' || !touchMap[touch.identifier]) {
                            touchMap[touch.identifier] = {
                                id: touch.identifier,
                                x: coords.x,
                                y: coords.y,
                                isThrust: isThrustLogicalPoint(coords.x, coords.y)
                            };
                        } else {
                            touchMap[touch.identifier].x = coords.x;
                            touchMap[touch.identifier].y = coords.y;
                        }
                    }
                } else {
                    for (i = 0; i < event.changedTouches.length; ++i) {
                        touch = event.changedTouches[i];
                        delete touchMap[touch.identifier];
                    }
                }

                rebuildActiveTouches();
            }

            var touchOptions = { passive: false, capture: true };
            canvas.addEventListener('touchstart', updateTouchEntries, touchOptions);
            canvas.addEventListener('touchmove', updateTouchEntries, touchOptions);
            canvas.addEventListener('touchend', updateTouchEntries, touchOptions);
            canvas.addEventListener('touchcancel', updateTouchEntries, touchOptions);
        }

        var activeTouches = [];
        var statusElement = document.getElementById('status');
        var gameCanvas = document.getElementById('canvas');

        var Module = {
            isMobileWeb: detectMobileWeb(),
            activeTouches: activeTouches,
            canvas: gameCanvas,
            printErr: function(text) {
                console.error(text);
                if (statusElement && text) {
                    var line = String(text).trim();
                    if (line.indexOf('WebGPU') >= 0 || line.indexOf('browser:') >= 0 || line.indexOf('bgfx renderer') >= 0) {
                        statusElement.textContent = line.slice(0, 160);
                    }
                }
            },
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                Module.setStatus.last = { time: Date.now(), text: text };
                if (text) {
                    statusElement.textContent = text;
                } else {
                    statusElement.textContent = '';
                }
            },
            onRuntimeInitialized: function() {
                Module.setStatus('');
                var canvas = Module.canvas;
                if (canvas) {
                    canvas.width = LOGICAL_WIDTH;
                    canvas.height = LOGICAL_HEIGHT;
                    canvas.focus();
                }
            }
        };

        if (gameCanvas) {
            gameCanvas.width = LOGICAL_WIDTH;
            gameCanvas.height = LOGICAL_HEIGHT;
            gameCanvas.addEventListener('webglcontextlost', function(e) {
                e.preventDefault();
                statusElement.textContent = 'WebGL/WebGPU context lost.';
            }, false);
            gameCanvas.addEventListener('mousedown', function() {
                gameCanvas.focus();
            }, false);
            installTouchTracking(gameCanvas, activeTouches);
        } else {
            console.error('NULL VECTOR: #canvas element not found.');
        }
    </script>
    <script async type="text/javascript" src="NULL_VECTOR.js"></script>
</body>
</html>
